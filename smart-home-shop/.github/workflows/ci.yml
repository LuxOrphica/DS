name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Security audit (critical)
        run: npm run security:audit

      - name: Encoding check
        run: npm run encoding:check

      - name: Lint
        run: npm run lint

      - name: ESLint
        run: npm run lint:eslint

      - name: Oxlint
        run: npm run lint:ox

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Test report
        if: always()
        run: npm run test:report

      - name: Vitest JUnit report
        if: always()
        run: npm run test:unit:report

      - name: Allure results
        if: always()
        run: npm run test:unit:allure

      - name: Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: |
            reports/test-results.junit.xml
            reports/vitest.junit.xml

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

  smoke-api:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        env:
          PORT: 3035
          ADMIN_TOKEN: ci-admin-token
        run: |
          nohup node server.js > /tmp/shop-server.log 2>&1 &
          sleep 4

      - name: Smoke health
        run: curl -fsS "http://127.0.0.1:3035/api/health"

      - name: Smoke products
        run: curl -fsS "http://127.0.0.1:3035/api/products"

      - name: Smoke admin auth
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3035/api/admin/brands)" = "401"
          curl -fsS -H "Authorization: Bearer ci-admin-token" "http://127.0.0.1:3035/api/admin/brands"
